name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest is 26.04, where setup-python has no prebuilt 3.9.
          # The official manifest provides 3.9.25 for Ubuntu 22.04 x64.
          - os: ubuntu-22.04
            node: 18
            python: "3.9"
          - os: ubuntu-latest
            node: 22
            python: "3.12"
          - os: macos-latest
            node: 22
            python: "3.12"
          - os: windows-latest
            node: 22
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run DSH, MCP, and legacy compatibility tests
        working-directory: plugins/deepseek-code-agent
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: npm test
